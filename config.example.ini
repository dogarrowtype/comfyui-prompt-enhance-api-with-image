[openai]
# Your OpenAI API key (required)
# Get your key from: https://platform.openai.com/api-keys
api_key = sk-your-api-key-here

# API endpoint (default: OpenAI)
# For OpenAI: https://api.openai.com/v1/chat/completions
# For Azure OpenAI: https://your-resource.openai.azure.com/openai/deployments/your-deployment/chat/completions?api-version=2024-02-01
# For Ollama: http://localhost:11434/v1/chat/completions
# For LM Studio: http://localhost:1234/v1/chat/completions
api_endpoint = https://api.openai.com/v1/chat/completions

# Temperature (0.0 to 2.0)
# Lower values make the output more focused and deterministic
# Higher values make the output more creative and random
temperature = 0.7

# Maximum tokens in the response
# Adjust based on your needs and API limits
max_tokens = 2000

# Top-p sampling (0.0 to 1.0)
# Alternative to temperature for controlling randomness
top_p = 1.0

[ollama]
# Ollama API endpoint (native Ollama API, not OpenAI-compatible)
# Default: http://localhost:11434/api/chat
api_endpoint = http://localhost:11434/api/chat

# Temperature (0.0 to 2.0)
temperature = 0.7

# Top-p sampling (0.0 to 1.0)
top_p = 1.0

# Top-k sampling (limits token selection to top K options)
top_k = 40

# Maximum number of tokens to predict
num_predict = 2000

# Context window size (number of tokens the model can process at once)
# Common values: 2048, 4096, 8192, 16384, 32768
# Higher values use more VRAM but allow longer inputs/outputs
num_ctx = 4096

# Request timeout in seconds (default: 300)
# Raise this for very long-running prompts (large models, big context, vision)
# e.g. 600 = 10 minutes, 1800 = 30 minutes
timeout = 300

# How long to keep the model loaded in memory
# Options:
#   - "0" or 0: Unload immediately after request (saves memory)
#   - "5m": Keep loaded for 5 minutes
#   - "1h": Keep loaded for 1 hour
#   - "-1": Keep loaded indefinitely
# Set to "0" to ensure model is unloaded immediately and free up VRAM
keep_alive = 0
